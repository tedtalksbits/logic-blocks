# Crafting recipe for a Logic Block. 1-3 rows of equal length (up to 3 characters); a space is an empty slot.
# Each letter maps to an item id. Restart after changing.
recipe:
  shape: [" C ", "RDR", " R "]
  ingredients:
    C: comparator
    R: redstone
    D: daylight_detector

# How often each Logic Block checks its rules, in ticks (1-20). 2 = ten times a second.
check-interval-ticks: 2

# Most Logic Blocks in one chunk (1-4096).
max-per-chunk: 64

# Who can change a Logic Block's rules: "owner" (whoever placed it; operators can always edit) or "anyone".
editing: owner
